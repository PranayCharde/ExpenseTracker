<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E40AF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner Soft Glow Border -->
  <rect x="8.75" y="8.75" width="102.5" height="102.5" rx="27.25" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Dynamic S Curve & Growth Arrow Shape -->
  <g transform="translate(24, 24)">
    <!-- Top Arc of 'S' flowing into upward momentum -->
    <path 
      d="M48 14 C48 14, 38 6, 24 6 C12 6, 6 13, 6 20 C6 30, 20 32, 28 35 C38 38, 48 42, 48 53 C48 64, 38 70, 24 70 C10 70, 4 60, 4 60" 
      stroke="url(#accentGrad)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Upward Growth Arrow Surge intersecting the top -->
    <path 
      d="M34 22 L48 8 L62 22" 
      stroke="#FFFFFF" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <path 
      d="M48 8 L48 38" 
      stroke="#FFFFFF" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Central gleaming currency node / spark -->
    <circle cx="24" cy="38" r="4.5" fill="#38BDF8" />
  </g>
</svg>

